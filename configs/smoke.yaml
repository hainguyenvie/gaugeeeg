seed: 7

data:
  root: data/mne
  cache_dir: data/cache
  task: four_class
  # One unilateral and one bilateral run are enough to exercise all 4 labels.
  runs: [4, 6]
  train_subjects: [1]
  val_subjects: [2]
  test_subjects: [3]
  resample_hz: 200
  epoch_seconds: 4.0
  highpass_hz: 0.3
  notch_hz: 60.0
  max_trials_per_subject: null

experiment:
  encoder: bandpower
  model_name: brain-bzh/reve-base
  position_model_name: brain-bzh/reve-positions
  reve_pooling: attention
  reve_input_scale_uv: 100.0
  batch_size: 32
  device: auto
  train_view: car
  test_views: [car, cz, pz, fcz, random_linear]
  defenses: [none, car_canonicalize]
  c_grid: [0.01, 0.1, 1.0, 10.0]
  output_dir: outputs/smoke_bandpower
  force_recompute: false
