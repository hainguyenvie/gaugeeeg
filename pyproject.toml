[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaugeeeg"
version = "0.1.0"
description = "Reference-shift robustness benchmark for EEG representation learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "GaugeEEG contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
data = [
  "edfio>=0.4,<1",
  "mne>=1.7,<2",
]
reve = [
  "einops>=0.7,<1",
  "huggingface-hub>=0.26,<2",
  "torch>=2.2,<3",
  "transformers>=4.56,<5",
]
dev = [
  "ruff>=0.6,<1",
]

[project.scripts]
gaugeeeg = "gaugeeeg.cli:main"
gaugeeeg-synthetic = "gaugeeeg.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
